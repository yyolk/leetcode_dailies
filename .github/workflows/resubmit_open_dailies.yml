name: Re-submit Open Daily PRs

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  resubmit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: pyproject.toml
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --no-install-project
        uv pip install curl_cffi
    - name: Re-submit open daily PRs
      env:
        PYTHONPATH: .
        LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        LEETCODE_CF_CLEARANCE: ${{ secrets.LEETCODE_CF_CLEARANCE }}
        GH_TOKEN: ${{ secrets.YYOLK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        # List open PRs with YYYYMMDD titles
        open_prs=$(gh pr list --state open --json number,title,headRefOid --jq '.[] | select(.title | test("^[0-9]{8}$")) | "\(.number) \(.title) \(.headRefOid)"')
        if [ -z "$open_prs" ]; then
          echo "No open daily PRs found."
          exit 0
        fi
        echo "$open_prs" | while read -r pr_number title sha; do
          echo "Re-submitting PR #$pr_number ($title)"
          uv run --no-sync python -m generate_active_daily.submit_solution \
            --title "$title" \
            --pr "$pr_number" \
            --sha "$sha" || echo "Failed for PR #$pr_number"
        done
