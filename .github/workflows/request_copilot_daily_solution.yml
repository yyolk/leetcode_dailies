name: Request Copilot Daily Solution

on:
  pull_request:
    types:
    - opened
    - synchronize

permissions:
  pull-requests: write
  issues: write

jobs:
  request-copilot:
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
    - name: Post Comment to Summon @copilot
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.YYOLK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        script: |
          const pr = context.payload.pull_request;
          const hasDailyLabel = pr.labels.some((label) => label.name === "daily-boilerplate");

          if (!hasDailyLabel) {
            core.info("Skipping Copilot request for non-daily-boilerplate PR.");
            return;
          }

          const prompt = "@copilot please write a comprehensive unit test suite covering the new changes introduced in this PR.";

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            body: prompt
          });

          core.info("Posted Copilot implementation request comment.");
