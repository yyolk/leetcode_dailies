name: Check PR Codified Solution

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - ready_for_review
  issue_comment:
    types:
    - created
  pull_request_review:
    types:
    - submitted

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  codified-solution-check:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.YYOLK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        script: |
          const optionalHundred = "(?: 💯)?";
          const optionalPercentile = "(?:\\s*\\((?:beats\\s*)?\\d+(?:\\.\\d+)?\\s*%\\))?";
          const timePattern = new RegExp(
            `^(?:[-*]\\s*)?\\d+(?:\\.\\d+)?\\s*ms${optionalPercentile}${optionalHundred}$`,
            "iu"
          );
          const memoryPattern = new RegExp(
            `^(?:[-*]\\s*)?\\d+(?:\\.\\d+)?\\s*mb${optionalPercentile}${optionalHundred}$`,
            "iu"
          );
          const hasPerformanceLines = (body) => {
            const normalizedBody = String(body ?? "").replaceAll("\r\n", "\n");
            const lines = normalizedBody
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean);

            const hasConsecutivePerformanceLines = lines.some(
              (line, index) =>
                timePattern.test(line) &&
                index + 1 < lines.length &&
                memoryPattern.test(lines[index + 1])
            );

            const hasInlinePerformance = /\b\d+(?:\.\d+)?\s*ms\b/iu.test(normalizedBody) &&
              /\b\d+(?:\.\d+)?\s*mb\b/iu.test(normalizedBody);

            return hasConsecutivePerformanceLines || hasInlinePerformance;
          };

          if (context.eventName === "issue_comment" || context.eventName === "pull_request_review") {
            const isIssueComment = context.eventName === "issue_comment";
            const authorLogin = isIssueComment
              ? context.payload.comment?.user?.login
              : context.payload.review?.user?.login;
            const messageBody = isIssueComment
              ? context.payload.comment?.body
              : context.payload.review?.body;

            if (isIssueComment && !context.payload.issue?.pull_request) {
              core.info("Skipping issue comment that is not on a PR.");
              return;
            }

            if (!isIssueComment && !context.payload.pull_request) {
              core.info("Skipping review that is not on a PR.");
              return;
            }

            if ((authorLogin ?? "").toLowerCase() !== "yyolk") {
              core.info("Skipping issue comment/review not authored by @yyolk.");
              return;
            }

            if (!hasPerformanceLines(messageBody)) {
              core.info("Skipping @yyolk issue comment/review without performance lines.");
              return;
            }
          }

          let pr = context.payload.pull_request;
          if (!pr && context.payload.issue?.pull_request) {
            const {data} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            pr = data;
          }

          if (!pr) {
            core.info("Skipping event without pull request payload.");
            return;
          }

          const isDailyTitle = /^[0-9]{8}$/.test(String(pr.title ?? "").trim());
          let hasDailyLabel = (pr.labels ?? []).some((label) => label.name === "daily-boilerplate");

          // opened can race the --label on gh pr create; refetch before giving up.
          if (!hasDailyLabel && !isDailyTitle) {
            const {data} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            pr = data;
            hasDailyLabel = (pr.labels ?? []).some((label) => label.name === "daily-boilerplate");
          }

          if (!hasDailyLabel && !isDailyTitle && !/^[0-9]{8}$/.test(String(pr.title ?? "").trim())) {
            core.info("Skipping check for non-daily-boilerplate PR.");
            return;
          }

          const isPermissionError = (error) =>
            String(error?.message ?? "").includes("Resource not accessible by integration");
          const isAlreadyMergeableError = (error) =>
            /clean status|already (?:fully )?mergeable/i.test(String(error?.message ?? ""));

          if (pr.draft) {
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  markPullRequestReadyForReview(input: {pullRequestId: $pullRequestId}) {
                    pullRequest {
                      id
                    }
                  }
                }`,
                {pullRequestId: pr.node_id}
              );
              core.info("Marked daily PR as ready for review.");
            } catch (error) {
              if (!isPermissionError(error)) {
                throw error;
              }
              core.warning("Skipping ready-for-review update due to token permissions.");
            }
          }

          const [issueComments, reviews, reviewComments] = await Promise.all([
            github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            }),
            github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            }),
            github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            })
          ]);

          const hasPerformanceComment = [...issueComments, ...reviews, ...reviewComments].some(
            (comment) =>
              (comment.user?.login ?? "").toLowerCase() === "yyolk" &&
              hasPerformanceLines(comment.body)
          );

          if (!hasPerformanceComment) {
            // pull_request runs must succeed so the required job name is not stuck failed.
            // Auto-merge is only enabled after the benchmark comment exists.
            if (context.eventName === "pull_request") {
              core.warning(
                "No @yyolk performance comment yet. Leaving auto-merge disabled until one is posted."
              );
              return;
            }
            core.setFailed(
              "Expected a @yyolk PR/review comment containing both runtime (`ms`) and memory (`mb`) benchmark figures."
            );
            return;
          }

          core.info("Found @yyolk performance lines in PR/review comments.");

          const squashMergeNow = async (reason) => {
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: "squash",
              sha: pr.head.sha
            });
            core.info(`Squash-merged daily PR immediately (${reason}).`);
          };

          if (!pr.auto_merge) {
            const state = String(pr.mergeable_state ?? "");
            if (state === "clean" || state === "unstable") {
              try {
                await squashMergeNow(`mergeable_state=${state}`);
              } catch (error) {
                if (!isPermissionError(error)) {
                  throw error;
                }
                core.warning("Skipping immediate squash merge due to token permissions.");
              }
            } else {
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: SQUASH}) {
                      pullRequest {
                        id
                      }
                    }
                  }`,
                  {pullRequestId: pr.node_id}
                );
                core.info("Enabled squash auto-merge for daily PR.");
              } catch (error) {
                if (isAlreadyMergeableError(error)) {
                  try {
                    await squashMergeNow("enableAutoMerge rejected already-mergeable PR");
                  } catch (mergeError) {
                    if (!isPermissionError(mergeError)) {
                      throw mergeError;
                    }
                    core.warning("Skipping immediate squash merge due to token permissions.");
                  }
                } else if (!isPermissionError(error)) {
                  throw error;
                } else {
                  core.warning("Skipping auto-merge enablement due to token permissions.");
                }
              }
            }
          }
    - name: Decide ready notification
      if: ${{ github.event_name == 'pull_request' }}
      id: ready_notify
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.YYOLK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        script: |
          const NOTIFY_LABEL = "daily-ready-notified";
          core.setOutput("send", "false");

          const pr = context.payload.pull_request;
          if (!pr) {
            core.info("No pull request payload; skip notify.");
            return;
          }

          if (context.payload.action !== "synchronize") {
            core.info(`Skipping ready notification on ${context.payload.action}.`);
            return;
          }

          const title = String(pr.title ?? "").trim();
          const labels = (pr.labels ?? []).map((label) => label.name);
          const isDaily = labels.includes("daily-boilerplate") || /^[0-9]{8}$/.test(title);
          if (!isDaily) {
            core.info("Not a daily PR; skip notify.");
            return;
          }

          if (labels.includes(NOTIFY_LABEL)) {
            core.info("Ready notification already sent.");
            return;
          }

          if (!/^[0-9]{8}$/.test(title)) {
            core.info("Daily title missing; skip notify.");
            return;
          }

          const commits = await github.paginate(github.rest.pulls.listCommits, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            per_page: 100
          });
          const headCommit = commits.find((commit) => commit.sha === pr.head.sha) ?? commits.at(-1);
          const message = headCommit?.commit?.message ?? "";
          if (!/^Implement [0-9]{8} daily solution/m.test(message)) {
            core.info("Head commit is not the solver implementation; skipping notify.");
            return;
          }

          const path = `solutions/${title.slice(0, 4)}/${title.slice(0, 6)}/${title}.py`;
          let source = "";
          try {
            const {data} = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: pr.head.sha
            });
            source = Buffer.from(data.content, "base64").toString("utf8");
          } catch (error) {
            core.info(`No solution file at ${path}: ${error.message}`);
            return;
          }

          // Boilerplate methods are a docstring plus a bare Ellipsis statement.
          if (/^[ \t]+\.\.\.[ \t]*$/m.test(source)) {
            core.info("Solution is still a stub; skip ready notification.");
            return;
          }

          try {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: NOTIFY_LABEL,
              color: "0e8a16",
              description: "Pushover ready-for-review already sent"
            });
          } catch (error) {
            const status = error.status ?? error.response?.status;
            if (status !== 422) {
              throw error;
            }
          }

          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            labels: [NOTIFY_LABEL]
          });
          core.setOutput("send", "true");
    - name: Checkout repository for local actions
      if: ${{ github.event_name == 'pull_request' && steps.ready_notify.outputs.send == 'true' }}
      uses: actions/checkout@v7
    - name: Notify daily PR status
      if: ${{ github.event_name == 'pull_request' && steps.ready_notify.outputs.send == 'true' }}
      uses: ./.github/actions/notify-pushover
      with:
        message: >-
          ${{ job.status == 'success'
              && format('Daily PR #{0} is ready for review.', github.event.pull_request.number)
              || format('Daily PR #{0} failed before ready for review. JOB_STATUS=''{1}''.', github.event.pull_request.number, job.status) }}
        ttl: "93600"
      env:
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_KEY }}
        PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
