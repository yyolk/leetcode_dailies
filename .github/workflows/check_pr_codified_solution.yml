name: Check PR Codified Solution

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - ready_for_review
  issue_comment:
    types:
    - created

permissions:
  contents: read
  pull-requests: write

jobs:
  codified-solution-check:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'issue_comment' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.YYOLK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        script: |
          const optionalHundred = "(?: 💯)?";
          const optionalPercentile = "(?:\\s*\\((?:beats\\s*)?\\d+(?:\\.\\d+)?\\s*%\\))?";
          const timePattern = new RegExp(
            `^(?:[-*]\\s*)?\\d+(?:\\.\\d+)?\\s*ms${optionalPercentile}${optionalHundred}$`,
            "iu"
          );
          const memoryPattern = new RegExp(
            `^(?:[-*]\\s*)?\\d+(?:\\.\\d+)?\\s*mb${optionalPercentile}${optionalHundred}$`,
            "iu"
          );
          const hasPerformanceLines = (body) => {
            const normalizedBody = String(body ?? "").replaceAll("\r\n", "\n");
            const lines = normalizedBody
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean);

            const hasConsecutivePerformanceLines = lines.some(
              (line, index) =>
                timePattern.test(line) &&
                index + 1 < lines.length &&
                memoryPattern.test(lines[index + 1])
            );

            const hasInlinePerformance = /\b\d+(?:\.\d+)?\s*ms\b/iu.test(normalizedBody) &&
              /\b\d+(?:\.\d+)?\s*mb\b/iu.test(normalizedBody);

            return hasConsecutivePerformanceLines || hasInlinePerformance;
          };

          if (context.eventName === "issue_comment") {
            if (!context.payload.issue?.pull_request) {
              core.info("Skipping issue comment that is not on a PR.");
              return;
            }

            if ((context.payload.comment?.user?.login ?? "").toLowerCase() !== "yyolk") {
              core.info("Skipping issue comment not authored by @yyolk.");
              return;
            }

            if (!hasPerformanceLines(context.payload.comment?.body)) {
              core.info("Skipping @yyolk issue comment without performance lines.");
              return;
            }
          }

          let pr = context.payload.pull_request;
          if (!pr && context.payload.issue?.pull_request) {
            const {data} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            pr = data;
          }

          if (!pr) {
            core.info("Skipping event without pull request payload.");
            return;
          }

          const hasDailyLabel = pr.labels.some((label) => label.name === "daily-boilerplate");

          if (!hasDailyLabel) {
            core.info("Skipping check for non-daily-boilerplate PR.");
            return;
          }

          const isPermissionError = (error) =>
            String(error?.message ?? "").includes("Resource not accessible by integration");

          if (pr.draft) {
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  markPullRequestReadyForReview(input: {pullRequestId: $pullRequestId}) {
                    pullRequest {
                      id
                    }
                  }
                }`,
                {pullRequestId: pr.node_id}
              );
              core.info("Marked daily PR as ready for review.");
            } catch (error) {
              if (!isPermissionError(error)) {
                throw error;
              }
              core.warning("Skipping ready-for-review update due to token permissions.");
            }
          }

          if (!pr.auto_merge) {
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: SQUASH}) {
                    pullRequest {
                      id
                    }
                  }
                }`,
                {pullRequestId: pr.node_id}
              );
              core.info("Enabled squash auto-merge for daily PR.");
            } catch (error) {
              if (!isPermissionError(error)) {
                throw error;
              }
              core.warning("Skipping auto-merge enablement due to token permissions.");
            }
          }

          const [issueComments, reviews, reviewComments] = await Promise.all([
            github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            }),
            github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            }),
            github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            })
          ]);

          const hasPerformanceComment = [...issueComments, ...reviews, ...reviewComments].some(
            (comment) =>
              (comment.user?.login ?? "").toLowerCase() === "yyolk" &&
              hasPerformanceLines(comment.body)
          );

          if (!hasPerformanceComment) {
            core.setFailed(
              "Expected a @yyolk PR/review comment containing both runtime (`ms`) and memory (`mb`) benchmark figures."
            );
            return;
          } else {
            core.info("Found @yyolk performance lines in PR/review comments.");
          }
    - name: Checkout repository for local actions
      if: ${{ github.event_name == 'pull_request' && always() && contains(github.event.pull_request.labels.*.name, 'daily-boilerplate') && github.event.action != 'ready_for_review' }}
      uses: actions/checkout@v7
    - name: Notify daily PR status
      if: ${{ github.event_name == 'pull_request' && always() && contains(github.event.pull_request.labels.*.name, 'daily-boilerplate') && github.event.action != 'ready_for_review' }}
      uses: ./.github/actions/notify-pushover
      with:
        message: >-
          ${{ job.status == 'success'
              && format('Daily PR #{0} is ready for review.', github.event.pull_request.number)
              || format('Daily PR #{0} failed before ready for review. JOB_STATUS=''{1}''.', github.event.pull_request.number, job.status) }}
        ttl: "93600"
      env:
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_KEY }}
        PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
