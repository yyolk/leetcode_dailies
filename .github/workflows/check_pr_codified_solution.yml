name: Check PR Codified Solution

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - ready_for_review
  pull_request_review:
    types:
    - submitted
    - edited
    - dismissed

permissions:
  contents: read
  pull-requests: write

jobs:
  codified-solution-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v9
      with:
        script: |
          const pr = context.payload.pull_request;
          const hasDailyLabel = pr.labels.some((label) => label.name === "daily-boilerplate");

          if (!hasDailyLabel) {
            core.info("Skipping check for non-daily-boilerplate PR.");
            return;
          }

          const isPermissionError = (error) =>
            String(error?.message ?? "").includes("Resource not accessible by integration");

          if (pr.draft) {
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  markPullRequestReadyForReview(input: {pullRequestId: $pullRequestId}) {
                    pullRequest {
                      id
                    }
                  }
                }`,
                {pullRequestId: pr.node_id}
              );
              core.info("Marked daily PR as ready for review.");
            } catch (error) {
              if (!isPermissionError(error)) {
                throw error;
              }
              core.warning("Skipping ready-for-review update due to token permissions.");
            }
          }

          if (!pr.auto_merge) {
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: SQUASH}) {
                    pullRequest {
                      id
                    }
                  }
                }`,
                {pullRequestId: pr.node_id}
              );
              core.info("Enabled squash auto-merge for daily PR.");
            } catch (error) {
              if (!isPermissionError(error)) {
                throw error;
              }
              core.warning("Skipping auto-merge enablement due to token permissions.");
            }
          }
    - uses: actions/github-script@v9
      if: ${{ always() && contains(github.event.pull_request.labels.*.name, 'daily-boilerplate') }}
      env:
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_KEY }}
        PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
        JOB_STATUS: ${{ job.status }}
      with:
        script: |
          const token = process.env.PUSHOVER_TOKEN;
          const user = process.env.PUSHOVER_USER;

          if (!token || !user) {
            core.warning("Skipping pushover notification because credentials are missing.");
            return;
          }

          const prNumber = context.payload.pull_request.number;
          const status = process.env.JOB_STATUS;
          const message =
            status === "success"
              ? `Daily PR #${prNumber} is ready for review.`
              : `Daily PR #${prNumber} failed before ready for review. JOB_STATUS='${status}'.`;

          const payload = new URLSearchParams({
            token,
            user,
            message,
            ttl: "3600"
          });

          const response = await fetch("https://api.pushover.net/1/messages.json", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: payload.toString()
          });

          if (!response.ok) {
            core.setFailed(`Pushover notification failed with status ${response.status}.`);
            return;
          }

          core.info(`Sent pushover notification for daily PR #${prNumber}.`);
  yyolk-performance-approval-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v9
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const pullNumber =
            context.payload.pull_request?.number ??
            context.payload.review?.pull_request_url?.split("/").pop();

          if (!pullNumber) {
            core.setFailed("Unable to determine pull request number.");
            return;
          }

          const prResponse = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: Number(pullNumber)
          });

          const hasDailyLabel = prResponse.data.labels.some(
            (label) => label.name === "daily-boilerplate"
          );

          if (!hasDailyLabel) {
            core.info("Skipping check for non-daily-boilerplate PR.");
            return;
          }

          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner,
            repo,
            pull_number: Number(pullNumber),
            per_page: 100
          });

          const optionalHundred = "(?: 💯)?";
          const optionalPercentile = "(?: \\((?:beats )?\\d+(?:\\.\\d+)?%\\))?";
          const timePattern = new RegExp(
            `^- \\d+(?:\\.\\d+)?ms${optionalPercentile}${optionalHundred}$`,
            "u"
          );
          const memoryPattern = new RegExp(
            `^- \\d+(?:\\.\\d+)?mb${optionalPercentile}${optionalHundred}$`,
            "u"
          );

          const hasPerformanceReviewApproval = reviews.some((review) => {
            if (review.state !== "APPROVED") {
              return false;
            }

            if ((review.user?.login ?? "").toLowerCase() !== "yyolk") {
              return false;
            }

            const body = String(review.body ?? "").replaceAll("\r\n", "\n");
            const lines = body.split("\n").map((line) => line.trim()).filter(Boolean);

            return lines.some(
              (line, index) =>
                timePattern.test(line) &&
                index + 1 < lines.length &&
                memoryPattern.test(lines[index + 1])
            );
          });

          if (!hasPerformanceReviewApproval) {
            core.setFailed(
              "Expected an APPROVED review from @yyolk containing performance lines like: `- 12.3ms (50%)` and `- 45.6mb (50%)`."
            );
            return;
          }
